[project]
name = "garmin-sync"
version = "0.1.0"
description = "Sync strength workouts with Garmin Connect"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.27.0",
    "garth>=0.4.0",
    "fitdecode>=0.10.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "cryptography>=49.0.0",  # Garmin token encryption (Fernet)
    "slowapi>=0.1.9",  # Rate limiting for FastAPI
    # Security floors for transitive dependencies (patched advisories, Oct 2026)
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "urllib3>=2.8.0",
    "idna>=3.15",
    "requests>=2.33.0",
    "oauthlib>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
